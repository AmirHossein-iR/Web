<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت شخصی امیر</title>

<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/web/Vazirmatn-font-face.css" rel="stylesheet">

<style>
body{
  margin:0;
  padding:30px 0;
  background:#f2f4f7;
  direction:rtl;
  font-family:"Vazirmatn",sans-serif;
  display:flex;
  justify-content:center;
}
.container{
  width:90%;
  max-width:800px;
  background:#111827;
  padding:25px;
  border-radius:25px;
  color:white;
}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{
  flex:1;
  padding:12px;
  background:#1f2937;
  border:none;
  border-radius:12px;
  color:white;
  cursor:pointer;
}
.tabs button.active{background:#3b82f6}
.page{display:none;background:#1e293b;padding:20px;border-radius:20px}
.page.active{display:block}

.admin{
  background:#020617;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
}
textarea,input{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:none;
}
button.send{
  background:#3b82f6;
  color:white;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.post{
  background:#0f172a;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}
.post img{width:100%;border-radius:12px;margin-top:10px}

.stories{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px}
.story img{
  width:90px;height:90px;
  border-radius:50%;
  border:3px solid #3b82f6;
  object-fit:cover;
}
</style>
</head>

<body>
<div class="container">

<h2 style="text-align:center">سایت شخصی امیر</h2>

<div class="tabs">
  <button class="active" onclick="showPage('about',this)">درباره من</button>
  <button onclick="showPage('posts',this)">پست‌ها</button>
</div>

<div id="about" class="page active">
  <p>سلام 👋 خوش اومدی به سایت من</p>
</div>

<div id="posts" class="page">

  <h3>استوری‌ها</h3>
  <div id="stories" class="stories"></div>

  <div id="adminPanel" class="admin" style="display:none">
    <h4>ارسال پست</h4>
    <textarea id="postText" placeholder="متن پست"></textarea>
    <input type="file" id="postImage">
    <button class="send" onclick="addPost()">ارسال پست</button>

    <h4 style="margin-top:20px">ارسال استوری</h4>
    <input type="file" id="storyImage">
    <button class="send" onclick="addStory()">ارسال استوری</button>
  </div>

  <div id="postsList"></div>
</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* 🔴 Firebase config خودت */
const firebaseConfig = {
  apiKey: "AIzaSyCqVYomMrlcJlw94lcej-Ao0Md8CNWOw4w",
  authDomain: "site-e0f15.firebaseapp.com",
  projectId: "site-e0f15",
  storageBucket: "site-e0f15.firebasestorage.app",
  messagingSenderId: "177456537790",
  appId: "1:177456537790:web:d1483ffdce13b32dd7feef"
};

/* 🔴 ایمیل خودت */
const adminEmail = "amirhoseinh555@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* admin check */
onAuthStateChanged(auth,user=>{
  if(user && user.email === adminEmail){
    adminPanel.style.display = "block";
  }
});

/* add post */
window.addPost = async function(){
  let imageUrl = "";
  const file = postImage.files[0];

  if(file){
    const r = ref(storage,"posts/"+Date.now());
    await uploadBytes(r,file);
    imageUrl = await getDownloadURL(r);
  }

  await addDoc(collection(db,"posts"),{
    text: postText.value,
    imageUrl,
    createdAt: Date.now()
  });

  postText.value="";
}

/* show posts */
onSnapshot(
  query(collection(db,"posts"),orderBy("createdAt","desc")),
  snap=>{
    postsList.innerHTML="";
    snap.forEach(d=>{
      const p=d.data();
      postsList.innerHTML += `
        <div class="post">
          <p>${p.text}</p>
          ${p.imageUrl ? `<img src="${p.imageUrl}">` : ""}
        </div>
      `;
    });
});

/* add story */
window.addStory = async function(){
  const file = storyImage.files[0];
  if(!file) return;

  const r = ref(storage,"stories/"+Date.now());
  await uploadBytes(r,file);
  const url = await getDownloadURL(r);

  await addDoc(collection(db,"stories"),{
    imageUrl: url,
    expireAt: Date.now() + 86400000
  });
}

/* show stories */
onSnapshot(collection(db,"stories"),snap=>{
  stories.innerHTML="";
  snap.forEach(d=>{
    const s=d.data();
    if(Date.now() < s.expireAt){
      stories.innerHTML += `
        <div class="story">
          <img src="${s.imageUrl}">
        </div>
      `;
    }
  });
});
</script>

<script>
function showPage(id,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}
</script>

</body>
</html>
