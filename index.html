<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت شخصی</title>

<!-- فونت فارسی -->
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.2/fonts/web/Vazirmatn-font-face.css" rel="stylesheet">

<style>
body{
    margin:0;
    padding:40px 0;
    background:#f2f4f7;
    direction:rtl;
    font-family:"Vazirmatn", sans-serif;
    display:flex;
    justify-content:center;
}

.container{
    width:90%;
    max-width:780px;
    background:#111827;
    padding:30px;
    border-radius:35px;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.45);
}

/* پروفایل */
.profile{
    text-align:center;
    margin-bottom:30px;
}
.profile img{
    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid #3b82f6;
    object-fit:cover;
    box-shadow:0 0 20px #3b82f6;
    margin-bottom:15px;
}

/* تب‌ها */
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}
.tabs button{
    flex:1;
    padding:12px;
    background:#1f2937;
    border:none;
    border-radius:12px;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.25s;
}
.tabs button.active{
    background:#3b82f6;
}

/* انیمیشن صفحات */
.page{
    display:none;
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    animation:fade 0.4s ease;
}
@keyframes fade{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}
.page.active{
    display:block;
}

/* دکمه‌های ارتباط */
.social-buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:20px;
}
.btn-social{
    padding:14px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    font-size:1.1rem;
    color:white;
    transition:0.25s;
}
.btn-social svg{
    width:26px;
    height:26px;
}
.telegram{background:#0088cc;}
.instagram{background:#d62976;}
.whatsapp{background:#25D366;}
.rubika{background:#4c6ef5;}
.btn-social:hover{opacity:0.8; transform:translateY(-3px);}

/* ماشین حساب (کد اصلی تو + بدون تغییر) */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif;}

.calculator{
  position:relative;
  background: rgba(0,0,0,0.85);
  border-radius: 30px;
  padding: 30px;
  width: 280px;
  box-shadow: 0 0 60px rgba(255,255,255,0.1);
  margin:auto;
  z-index:1;
}

.display{
  background: rgba(255,255,255,0.05);
  color:#fff;
  border-radius:20px;
  padding:25px;
  text-align:right;
  font-size:2.5rem;
  margin-bottom:25px;
  overflow-x:auto;
  text-shadow:0 0 15px #0ff,0 0 30px #00f;
  transition: all 0.2s ease;
}

.buttons{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows:70px;
  gap:15px;
}

button{
  font-size:1.3rem;
  border:none;
  border-radius:15px;
  cursor:pointer;
  color:#fff;
  background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition: all 0.2s ease, box-shadow 0.3s ease;
}

button:hover{transform:translateY(-3px);}
button:active{transform:scale(0.95);}

.operator{background: linear-gradient(145deg, #ff416c, #ff4b2b);}
.equal{background: linear-gradient(145deg, #00c6ff, #0072ff);}
.function{background: linear-gradient(145deg, #f7971e, #ffd200);}
</style>
</head>

<body>

<div class="container">

    <!-- پروفایل -->
    <div class="profile">
        <img src="Aks.png" alt="">
        <h2>سلام، به سایت من خوش اومدی</h2>
    </div>

    <!-- تب ها -->
    <div class="tabs">
        <button class="active" onclick="showPage('about', this)">درباره من</button>
        <button onclick="showPage('contact', this)">ارتباط</button>
        <button onclick="showPage('projects', this)">پروژه‌ها</button>
    </div>

    <!-- درباره من -->
    <div id="about" class="page active">
        <h2>درباره من</h2>
        <p>سلام من امیرم</p>
        <p>یک برنامه نویس تازه کار که به دنبال پیشرفت هستم</p>
        <p>من تا فعلا با زبان های HTML, CSS, JavaScript, Python کار میکنم</p>
    </div>

    <!-- ارتباط -->
    <div id="contact" class="page">
        <h2>راه‌های ارتباط</h2>

        <div class="social-buttons">

            <!-- ✅ تلگرام -->
            <a href="https://t.me/Anssellll" class="btn-social telegram" target="_blank">
                <!-- آیکون تلگرام -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24"><path d="M9.999 15.17 9.84 18.27c.36 0 .52-.15.71-.33l1.7-1.63 3.53 2.58c.65.36 1.11.17 1.28-.6l2.32-10.92c.21-.95-.34-1.32-.97-1.09L3.48 10.3c-.93.36-.92.88-.17 1.11l4.7 1.47 10.9-6.87-8.97 7.16z"/></svg>
                تلگرام
            </a>

            <!-- ✅ اینستاگرام -->
            <a href="https://instagram.com/amir._.hdi" class="btn-social instagram" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24"><path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/></svg>
                اینستاگرام
            </a>

            <!-- ✅ واتساپ -->
            <a href="https://wa.me/09382246900" class="btn-social whatsapp" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24"><path d="M20 4.01A9.93 9.93 0 0012.004 2C6.49 2 2 6.49 2 12.004a9.93 9.93 0 002.01 5.99L2 22l4.11-1.97a9.93 9.93 0 005.894 1.97C17.51 22 22 17.51 22 12.004A9.93 9.93 0 0020 4.01zM12.004 20c-1.9 0-3.71-.56-5.25-1.63l-.38-.25-2.46 1.17.52-2.39-.25-.37A7.96 7.96 0 014 12.004C4 7.59 7.59 4 12.004 4 16.41 4 20 7.59 20 12.004 20 16.41 16.41 20 12.004 20zm4.61-5.59c-.25-.12-1.47-.72-1.7-.8-.23-.08-.4-.12-.57.12-.17.23-.65.8-.8.96-.15.17-.3.18-.56.06a6.54 6.54 0 01-3.83-3.39c-.29-.5.29-.47.83-1.55.09-.17.05-.32-.02-.45l-.8-1.89c-.2-.49-.41-.42-.57-.43h-.49c-.17 0-.45.06-.69.32-.24.26-.9.88-.9 2.14 0 1.26.92 2.47 1.05 2.64.12.17 1.82 2.78 4.37 3.9 2.56 1.12 2.56.75 3.02.7.47-.04 1.47-.6 1.68-1.18s.21-1.08.15-1.18c-.06-.1-.22-.17-.47-.29z"/></svg>
                واتساپ
            </a>

        </div>
    </div>

    <!-- پروژه‌ها -->
    <div id="projects" class="page">
        <h2 style="text-align:center; margin-bottom:20px;">پروژه ماشین حساب وب(بقیه پروژه ها بزودی...)</h2>

        <!-- ماشین حساب اصلی تو -->
        <div class="calculator">
            <div id="display" class="display">0</div>
            <div class="buttons">
                <button class="function" onclick="clearDisplay()">C</button>
                <button class="function" onclick="toggleSign()">+/-</button>
                <button class="function" onclick="appendValue('%')">%</button>
                <button class="operator" onclick="appendValue('/')">÷</button>
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">-</button>
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>
        </div>

    </div>

</div>

<script>
/* تغییر تب‌ها */
function showPage(id, btn){
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

/* ماشین حساب – نسخه اصلی تو */
const displayElem = document.getElementById('display');
let currentInput='';

function appendValue(value){
  if(value==='%' && currentInput!=='') {
    currentInput = (parseFloat(currentInput)/100).toString();
    displayElem.textContent=currentInput;
    return;
  }
  if(currentInput.length>=15) return;
  if(value==='.' && currentInput.includes('.')) return;

  currentInput += value;
  displayElem.textContent=currentInput;
}

function clearDisplay(){
  currentInput='';
  displayElem.textContent='0';
}

function toggleSign(){
  if(currentInput==='') return;
  if(currentInput.startsWith('-')) currentInput=currentInput.substring(1);
  else currentInput='-'+currentInput;
  displayElem.textContent=currentInput;
}

function calculate(){
  try{
    let result=eval(currentInput);
    displayElem.textContent=result;
    currentInput=result.toString();
  }catch{
    displayElem.textContent='خطا';
    currentInput='';
  }
}
</script>

</body>
</html>
