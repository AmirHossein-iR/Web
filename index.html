<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت لحظه‌ای ارز دیجیتال</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
body {
    font-family: Vazirmatn, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    max-width: 900px;
    width: 100%;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

.status {
    font-size: 0.9rem;
    margin-top: 10px;
    color: #555;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.name {
    font-size: 1.1rem;
}

.price {
    font-size: 1.2rem;
    font-weight: bold;
}
</style>
</head>

<body>
<div class="container">
    <header>
        <h1>قیمت لحظه‌ای ارز دیجیتال</h1>
        <div class="status" id="status">در حال دریافت اطلاعات...</div>
    </header>

    <div class="grid" id="grid"></div>
</div>

<script>
const cryptos = [
    { id: 'bitcoin', name: 'بیت‌کوین', symbol: 'BTC' },
    { id: 'ethereum', name: 'اتریوم', symbol: 'ETH' },
    { id: 'tether', name: 'تتر', symbol: 'USDT' },
    { id: 'dogecoin', name: 'دوج‌کوین', symbol: 'DOGE' },
    { id: 'tron', name: 'ترون', symbol: 'TRX' }
];

const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');

async function getDollarPrice() {
    const res = await fetch('https://call.tgju.org/ajax.json');
    const data = await res.json();
    return parseInt(data.price_dollar_rl.p.replace(/,/g,'')) / 10;
}

async function getCryptoPrices() {
    const ids = cryptos.map(c => c.id).join(',');
    const res = await fetch(
        `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`
    );
    return res.json();
}

async function loadData() {
    try {
        statusEl.textContent = 'در حال دریافت اطلاعات...';

        const dollar = await getDollarPrice();
        const crypto = await getCryptoPrices();

        grid.innerHTML = '';

        cryptos.forEach(c => {
            const toman = Math.floor(crypto[c.id].usd * dollar);

            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="name">
                    ${c.name}
                    <div style="font-size:.8rem;color:#888">${c.symbol}</div>
                </div>
                <div class="price">
                    ${toman.toLocaleString('fa-IR')} تومان
                </div>
            `;
            grid.appendChild(div);
        });

        statusEl.textContent =
            'آخرین بروزرسانی: ' + new Date().toLocaleTimeString('fa-IR');

    } catch (e) {
        console.error(e);
        statusEl.textContent = 'خطا در دریافت اطلاعات';
        statusEl.style.color = 'red';
    }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
