<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قیمت لحظه‌ای ارزهای دیجیتال (اتوماتیک)</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* کارت نمایش نرخ تتر */
        .tether-rate-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 15px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .tether-title {
            color: #6ee7b7;
            font-size: 0.9rem;
        }

        .tether-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* گرید کارت‌ها */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(79, 172, 254, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .coin-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .coin-info h2 { font-size: 1.2rem; margin-bottom: 0.2rem; }
        .coin-symbol { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }

        .price-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .price-usd {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8fafc;
            direction: ltr;
            text-align: right;
        }

        .price-toman {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .price-change {
            font-size: 0.9rem;
            font-weight: bold;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            width: fit-content;
            direction: ltr;
        }

        .positive { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .negative { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
            grid-column: 1 / -1;
        }

        footer {
            margin-top: 3rem;
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .tether-rate-box { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>بازار آنلاین کریپتو</h1>
        
        <div class="tether-rate-box">
            <span class="tether-title">نرخ لحظه‌ای تتر (نوبیتکس)</span>
            <span class="tether-price" id="tether-price-display">در حال دریافت...</span>
        </div>

        <br>
        <button class="refresh-btn" onclick="updateAllPrices()">بروزرسانی قیمت‌ها</button>
    </header>

    <div class="crypto-grid" id="crypto-container">
        <div class="loading">در حال دریافت اطلاعات بازار جهانی و نرخ دلار...</div>
    </div>

    <footer>
        قیمت جهانی از CoinGecko <br>
        قیمت تتر (دلار) از API نوبیتکس
    </footer>

    <script>
        const coins = [
            'bitcoin', 'ethereum', 'binancecoin', 'solana', 'ripple', 
            'dogecoin', 'toncoin', 'tron', 'shiba-inu', 'cardano'
        ];

        const coinImages = {
            'bitcoin': 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png',
            'ethereum': 'https://assets.coingecko.com/coins/images/279/large/ethereum.png',
            'binancecoin': 'https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png',
            'solana': 'https://assets.coingecko.com/coins/images/4128/large/solana.png',
            'ripple': 'https://assets.coingecko.com/coins/images/44/large/xrp-symbol-white-128.png',
            'dogecoin': 'https://assets.coingecko.com/coins/images/5/large/dogecoin.png',
            'toncoin': 'https://assets.coingecko.com/coins/images/17980/large/ton_symbol.png',
            'tron': 'https://assets.coingecko.com/coins/images/1094/large/tron-logo.png',
            'shiba-inu': 'https://assets.coingecko.com/coins/images/11939/large/shiba.png',
            'cardano': 'https://assets.coingecko.com/coins/images/975/large/cardano.png'
        };

        const coinNamesFa = {
            'bitcoin': 'بیت‌کوین', 'ethereum': 'اتریوم', 'binancecoin': 'بایننس کوین',
            'solana': 'سولانا', 'ripple': 'ریپل', 'dogecoin': 'دوج‌کوین',
            'toncoin': 'تون‌کوین', 'tron': 'ترون', 'shiba-inu': 'شیبا اینو', 'cardano': 'کاردانو'
        };

        const container = document.getElementById('crypto-container');
        const tetherDisplay = document.getElementById('tether-price-display');

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // تابع دریافت نرخ تتر از نوبیتکس (با استفاده از پروکسی برای رفع CORS)
        async function getTetherRate() {
            try {
                // استفاده از api.allorigins.win برای دور زدن محدودیت مرورگر
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const targetUrl = 'https://api.nobitex.ir/market/stats';
                
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
                const data = await response.json();
                
                // قیمت usdt-rls را می‌گیریم و تقسیم بر 10 می‌کنیم تا تومان شود
                const tetherRial = parseInt(data.stats['usdt-rls'].latest);
                const tetherToman = tetherRial / 10;
                
                return tetherToman;
            } catch (error) {
                console.error("خطا در دریافت نرخ تتر:", error);
                // اگر API نوبیتکس کار نکرد، یک نرخ پیش‌فرض برمی‌گرداند
                return 70000; 
            }
        }

        // تابع اصلی آپدیت
        async function updateAllPrices() {
            // نمایش لودینگ فقط بار اول
            if(container.children.length === 0 || container.querySelector('.loading')) {
                container.innerHTML = '<div class="loading">در حال دریافت قیمت‌ها...</div>';
            }
            tetherDisplay.innerHTML = '<span style="font-size:1rem; opacity:0.7">...</span>';

            try {
                // دریافت همزمان نرخ تتر و قیمت جهانی کریپتوها
                const [tetherRate, globalDataReq] = await Promise.all([
                    getTetherRate(),
                    fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coins.join(',')}&vs_currencies=usd&include_24hr_change=true`)
                ]);

                if (!globalDataReq.ok) throw new Error('خطا در کوین‌گکو');
                const globalData = await globalDataReq.json();

                // آپدیت باکس نرخ تتر
                tetherDisplay.innerText = `${formatNumber(tetherRate)} تومان`;

                // رندر کردن کارت‌ها
                renderCoins(globalData, tetherRate);

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div style="text-align:center; color:#ef4444; grid-column: 1/-1;">
                        خطا در دریافت اطلاعات. لطفا فیلترشکن خود را بررسی کنید.
                        <br>
                        <button class="refresh-btn" style="margin-top:1rem" onclick="updateAllPrices()">تلاش مجدد</button>
                    </div>`;
            }
        }

        function renderCoins(data, rate) {
            container.innerHTML = ''; 

            coins.forEach(coinId => {
                const coinData = data[coinId];
                if (!coinData) return;

                const priceUsd = coinData.usd;
                const change24h = coinData.usd_24h_change.toFixed(2);
                const priceToman = Math.floor(priceUsd * rate);
                
                const changeClass = change24h >= 0 ? 'positive' : 'negative';
                const changeSign = change24h >= 0 ? '+' : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <img src="${coinImages[coinId]}" alt="${coinId}" class="coin-icon">
                        <div class="coin-info">
                            <h2>${coinNamesFa[coinId]}</h2>
                            <span class="coin-symbol">${coinId}</span>
                        </div>
                    </div>
                    <div class="price-container">
                        <div class="price-usd">$${formatNumber(priceUsd)}</div>
                        <div class="price-toman">${formatNumber(priceToman)} تومان</div>
                    </div>
                    <div class="price-change ${changeClass}">
                        ${changeSign}${change24h}% (24h)
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // شروع برنامه
        updateAllPrices();
        
        // آپدیت خودکار هر 1 دقیقه
        setInterval(updateAllPrices, 60000);

    </script>
</body>
</html>
